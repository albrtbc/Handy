name: "Fork: cleanup"

# Frees the fork's Actions storage and drops old public downloads. It deletes
# every run artifact (the installers stay available in the releases), every
# release and its tag except the newest `keep`, every finished workflow run
# except the newest `keep` Windows builds and the newest run of each disabled
# workflow, and the Actions caches that a newer cache replaced or that the
# latest Windows build didn't use. It runs after each published release, and
# by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Releases and Windows build runs to keep"
        type: number
        default: 2
  workflow_call:
    inputs:
      keep:
        type: number
        default: 2

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP: ${{ inputs.keep }}
    steps:
      - name: Check the input
        run: |
          if ! [ "$KEEP" -ge 1 ] 2>/dev/null; then
            echo "keep must be at least 1, got '$KEEP'" >&2
            exit 1
          fi

      - name: Delete run artifacts
        run: |
          gh api "repos/$GH_REPO/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | "\(.id) \(.name)"' |
            while read -r id name; do
              echo "Deleting artifact $id ($name)"
              gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"
            done

      - name: Delete old releases and their tags
        run: |
          gh release list --limit 1000 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[$KEEP:][] | .tagName" |
            while read -r tag; do
              echo "Deleting release $tag"
              gh release delete "$tag" --cleanup-tag --yes
            done

      # Deleting the last run of a disabled inherited workflow (Main Branch
      # Build) turns it from disabled to "deleted", which can't be disabled,
      # and the next push to main re-enables and runs it. Keeping its newest
      # run keeps it disabled.
      - name: Delete old workflow runs
        run: |
          disabled=$(gh api "repos/$GH_REPO/actions/workflows?per_page=100" --paginate \
            --jq '.workflows[] | select(.state | startswith("disabled")) | .id' | jq -sc .)
          gh api "repos/$GH_REPO/actions/runs?per_page=100" --paginate --jq '.workflow_runs[]' |
            jq -rs --argjson keep "$KEEP" --argjson disabled "$disabled" '
              (map(select(.path | startswith(".github/workflows/fork-windows-build.yml")))
                | sort_by(.created_at) | reverse | .[:$keep] | map(.id)) as $kept
              | (map(select(.workflow_id | IN($disabled[])))
                | group_by(.workflow_id) | map(max_by(.created_at).id)) as $anchors
              | .[]
              | select(.status == "completed" and (.id | IN($kept[], $anchors[]) | not))
              | "\(.id) \(.name)"' |
            while read -r id name; do
              echo "Deleting run $id ($name)"
              gh api -X DELETE "repos/$GH_REPO/actions/runs/$id"
            done

      # A cache key ends in a hash; caches that differ only there are versions
      # of the same cache, and only the newest is ever restored.
      - name: Delete stale caches
        run: |
          since=$(gh api "repos/$GH_REPO/actions/workflows/fork-windows-build.yml/runs?per_page=1" \
            --jq '.workflow_runs[0].run_started_at // ""')
          gh api "repos/$GH_REPO/actions/caches?per_page=100" --paginate --jq '.actions_caches[]' |
            jq -rs --arg since "$since" '
              def ts: sub("\\.[0-9]+"; "") | fromdateiso8601;
              group_by(.key | sub("-[^-]*$"; ""))[]
              | sort_by(.last_accessed_at | ts) | reverse
              | (.[1:][]),
                (.[0] | select($since != "" and (.last_accessed_at | ts) < ($since | ts)))
              | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "Deleting cache $key"
              gh api -X DELETE "repos/$GH_REPO/actions/caches/$id"
            done
